[build]
  command = "npm run build"
  publish = "dist"

# The public "Powered by Netlify" badge is disabled in the project's General settings.

[build.environment]
  NODE_VERSION = "22"
  PUBLIC_DISCOVERY_BOOKING_URL = "https://cal.com/danny-sullivan/discovery"
  PUBLIC_SESSION_BOOKING_URL = "https://cal.com/danny-sullivan/ai-for-business-leaders"
  PUBLIC_SESSION_PRICE_USD = "249"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
